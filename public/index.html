<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f0d"><title>Startportal V5</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand"><b>S</b><span><strong>Startportal</strong><small>D1-utgåva</small></span></div><form id="searchForm"><input id="search" placeholder="Sök bland länkar eller tryck Enter för webbsökning"></form><button id="adminBtn">Lås upp</button></header><div class="layout"><aside><section class="panel weather"><div class="head"><h2>Väder</h2><button id="placeBtn" class="admin">Byt ort</button></div><div id="weather">Laddar…</div></section><section class="panel"><h2>Säkerhetskopia</h2><div class="buttons"><button id="exportBtn">Exportera</button><label class="button admin" for="importFile">Importera</label><input hidden id="importFile" type="file" accept="application/json"></div></section></aside><main><div class="welcome"><div><p id="dateText"></p><h1 id="greeting"></h1></div><div class="buttons admin"><button id="editBtn">Redigera</button><button id="newCat">+ Kategori</button><button id="newLink" class="primary">+ Länk</button></div></div><div id="columns" class="columns"></div><section class="panel"><div class="head"><h2>RSS-flöden</h2><button id="feedBtn" class="admin">Hantera</button></div><div id="tabs" class="tabs"></div><div id="feedList"></div></section></main><aside><section class="panel sticky"><div class="head"><h2>Kalender</h2><div class="buttons"><button id="prev">‹</button><button id="today">Idag</button><button id="next">›</button></div></div><h2 id="month"></h2><div id="calendar" class="calendar"></div><div id="dayInfo"></div></section></aside></div><dialog id="editDialog"><form id="editForm"><h2 id="editTitle"></h2><input name="type" hidden><input name="id" hidden><label>Namn<input name="name" required></label><label id="urlLabel">Webbadress<input name="url" type="url"></label><label id="co
